name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar tkinter y unzip (para los autotests)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-tk unzip

      - name: Autotests (compilación, motor, servidor, saves, atajos)
        run: python3 tests/selftest.py
