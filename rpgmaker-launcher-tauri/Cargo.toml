[package]
name = "rpgmaker-launcher-tauri"
version = "0.9.2"
edition = "2021"
build = "build.rs"
description = "Lanzador de juegos RPG Maker y Ren'Py para Linux"
authors = ["AsterrZep"]
license = "MIT"

[dependencies]
# Tauri core
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime
tokio = { version = "1.38", features = ["full"] }

# HTTP client (for sync, updates, etc.)
reqwest = { version = "0.12", features = ["json", "stream"] }

# Cryptography & Hashing
aes = "0.8"
hex = "0.4"
sha2 = "0.10"

# Parallel processing
rayon = "1.10"

# File system
walkdir = "2.5"

# Compression (for save files)
lz-str = "0.1"
flate2 = "1.0"

# Date/Time
chrono = "0.4"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Regex
regex = "1.10"

# Base64
base64 = "0.22"

# UUID
uuid = { version = "1.10", features = ["v4"] }

# Logging
log = "0.4"
env_logger = "0.11"

# Process management
nix = { version = "0.29", features = ["signal"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "z"  # Optimize for minimal binary size
panic = "abort"
strip = true  # Remove debug symbols
